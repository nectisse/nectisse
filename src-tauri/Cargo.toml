[package]
name = "nectisse-app"
version = "0.2.4"
description = "A private collection and creator updates workspace"
edition = "2021"
rust-version = "1.93"

[lib]
name = "nectisse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
native-smoke = ["dep:block2", "dep:objc2-web-kit", "dep:objc2-app-kit", "dep:objc2-foundation"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
sha2 = "0.10"
sha1 = "0.10"
aes-gcm = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = "0.12"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
url = "2"
regex = "1"
libc = "0.2"
arboard = { version = "3.7", default-features = false }
fs2 = "0.4"
tauri-plugin-updater = "2.11.0"
jsonschema = { version = "0.60.2", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"
core-foundation-sys = "0.8"
objc2 = "0.6"
block2 = { version = "0.6", optional = true }
objc2-web-kit = { version = "0.3", optional = true, features = ["WKSnapshotConfiguration", "WKWebView", "block2"] }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSImage", "NSBitmapImageRep"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSData", "NSDictionary", "NSString", "NSError"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[profile.release.build-override]
strip = false
